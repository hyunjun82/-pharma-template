<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 애니메이션 비디오 생성기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .drop-zone.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .drop-zone-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .drop-zone-subtext {
            color: #999;
            font-size: 14px;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .image-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: all 0.2s;
        }

        .image-preview-item .remove-btn:hover {
            background: rgba(255, 0, 0, 1);
            transform: scale(1.1);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f2ff;
            color: #667eea;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e8ebff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-bottom: 20px;
        }

        .progress-bar-wrapper {
            background: #f0f2ff;
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .info-box {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #856404;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        canvas {
            display: none;
        }

        .animation-settings {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            font-weight: 600;
            color: #333;
        }

        .setting-value {
            color: #667eea;
            font-weight: 600;
        }

        input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>이미지 애니메이션 비디오 생성기</h1>
        <p class="subtitle">이미지 10장을 생동감 있는 40초 동영상으로 변환</p>

        <div class="info-box">
            <strong>사용 방법:</strong>
            1. 아래 영역에 이미지 10장을 드래그앤드롭하세요<br>
            2. "영상 만들기" 버튼을 클릭하세요<br>
            3. 처리가 완료되면 자동으로 다운로드됩니다
        </div>

        <div class="animation-settings">
            <h3 style="margin-bottom: 15px; color: #333;">애니메이션 설정</h3>
            <div class="setting-row">
                <span class="setting-label">각 이미지 표시 시간</span>
                <span class="setting-value">4초</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">총 영상 길이</span>
                <span class="setting-value">40초</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">해상도</span>
                <span class="setting-value">1920x1080 (Full HD)</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">프레임레이트</span>
                <span class="setting-value">30 FPS</span>
            </div>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-text">여기에 이미지를 드래그하세요</div>
            <div class="drop-zone-subtext">또는 클릭하여 파일 선택 (10장)</div>
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
        </div>

        <div class="image-preview" id="imagePreview"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
            <div class="progress-text" id="progressText">준비 중...</div>
        </div>

        <div class="controls">
            <button class="btn-secondary" id="clearBtn">초기화</button>
            <button class="btn-primary" id="generateBtn" disabled>영상 만들기</button>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let images = [];
        const MAX_IMAGES = 10;
        const IMAGE_DURATION = 4; // seconds per image
        const FPS = 30;
        const WIDTH = 1920;
        const HEIGHT = 1080;

        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // 드래그앤드롭 이벤트
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 파일 처리
        function handleFiles(files) {
            const fileArray = Array.from(files).filter(file => file.type.startsWith('image/'));

            if (images.length + fileArray.length > MAX_IMAGES) {
                alert(`최대 ${MAX_IMAGES}장까지만 업로드할 수 있습니다.`);
                return;
            }

            fileArray.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        images.push(img);
                        updatePreview();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 미리보기 업데이트
        function updatePreview() {
            imagePreview.innerHTML = '';
            images.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'image-preview-item';

                const imgEl = document.createElement('img');
                imgEl.src = img.src;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.onclick = () => {
                    images.splice(index, 1);
                    updatePreview();
                };

                div.appendChild(imgEl);
                div.appendChild(removeBtn);
                imagePreview.appendChild(div);
            });

            generateBtn.disabled = images.length !== MAX_IMAGES;
        }

        // 초기화
        clearBtn.addEventListener('click', () => {
            images = [];
            updatePreview();
            fileInput.value = '';
        });

        // Ken Burns 효과 생성
        function getKenBurnsEffect(index) {
            const effects = [
                { // 줌인 + 우측 이동
                    startScale: 1.0,
                    endScale: 1.3,
                    startX: 0,
                    endX: -0.15,
                    startY: 0,
                    endY: 0
                },
                { // 줌아웃 + 좌측 이동
                    startScale: 1.3,
                    endScale: 1.0,
                    startX: -0.15,
                    endX: 0,
                    startY: 0,
                    endY: 0
                },
                { // 줌인 + 아래 이동
                    startScale: 1.0,
                    endScale: 1.3,
                    startX: 0,
                    endX: 0,
                    startY: 0,
                    endY: -0.15
                },
                { // 줌인 + 대각선 이동
                    startScale: 1.0,
                    endScale: 1.25,
                    startX: 0.1,
                    endX: -0.1,
                    startY: 0.1,
                    endY: -0.1
                },
                { // 줌아웃 + 위 이동
                    startScale: 1.3,
                    endScale: 1.0,
                    startX: 0,
                    endX: 0,
                    startY: -0.15,
                    endY: 0
                }
            ];

            return effects[index % effects.length];
        }

        // 이미지 그리기
        function drawImage(img, progress, effect) {
            const scale = effect.startScale + (effect.endScale - effect.startScale) * progress;
            const offsetX = (effect.startX + (effect.endX - effect.startX) * progress) * WIDTH;
            const offsetY = (effect.startY + (effect.endY - effect.startY) * progress) * HEIGHT;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            const imgAspect = img.width / img.height;
            const canvasAspect = WIDTH / HEIGHT;

            let drawWidth, drawHeight;
            if (imgAspect > canvasAspect) {
                drawHeight = HEIGHT * scale;
                drawWidth = drawHeight * imgAspect;
            } else {
                drawWidth = WIDTH * scale;
                drawHeight = drawWidth / imgAspect;
            }

            const x = (WIDTH - drawWidth) / 2 + offsetX;
            const y = (HEIGHT - drawHeight) / 2 + offsetY;

            ctx.drawImage(img, x, y, drawWidth, drawHeight);
        }

        // 페이드 효과
        function applyFade(alpha) {
            ctx.fillStyle = `rgba(0, 0, 0, ${1 - alpha})`;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        // 비디오 생성
        async function generateVideo() {
            if (images.length !== MAX_IMAGES) {
                alert(`정확히 ${MAX_IMAGES}장의 이미지가 필요합니다.`);
                return;
            }

            generateBtn.disabled = true;
            clearBtn.disabled = true;
            progressContainer.style.display = 'block';

            try {
                const stream = canvas.captureStream(FPS);
                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp9',
                    videoBitsPerSecond: 8000000
                });

                const chunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        chunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'animated-video.webm';
                    a.click();
                    URL.revokeObjectURL(url);

                    progressContainer.style.display = 'none';
                    generateBtn.disabled = false;
                    clearBtn.disabled = false;
                    alert('영상이 성공적으로 생성되었습니다!');
                };

                mediaRecorder.start();

                const totalFrames = IMAGE_DURATION * FPS * MAX_IMAGES;
                const framesPerImage = IMAGE_DURATION * FPS;
                const fadeFrames = Math.floor(FPS * 0.5); // 0.5초 페이드

                for (let frame = 0; frame < totalFrames; frame++) {
                    const imageIndex = Math.floor(frame / framesPerImage);
                    const frameInImage = frame % framesPerImage;
                    const progress = frameInImage / framesPerImage;

                    const effect = getKenBurnsEffect(imageIndex);
                    drawImage(images[imageIndex], progress, effect);

                    // 페이드 인
                    if (frameInImage < fadeFrames) {
                        applyFade(frameInImage / fadeFrames);
                    }
                    // 페이드 아웃
                    else if (frameInImage > framesPerImage - fadeFrames) {
                        applyFade((framesPerImage - frameInImage) / fadeFrames);
                    }

                    const percent = Math.round((frame / totalFrames) * 100);
                    progressBar.style.width = `${percent}%`;
                    progressBar.textContent = `${percent}%`;
                    progressText.textContent = `이미지 ${imageIndex + 1}/${MAX_IMAGES} 처리 중...`;

                    await new Promise(resolve => setTimeout(resolve, 1000 / FPS));
                }

                progressText.textContent = '영상 저장 중...';
                mediaRecorder.stop();

            } catch (error) {
                console.error('Error:', error);
                alert('영상 생성 중 오류가 발생했습니다: ' + error.message);
                progressContainer.style.display = 'none';
                generateBtn.disabled = false;
                clearBtn.disabled = false;
            }
        }

        generateBtn.addEventListener('click', generateVideo);
    </script>
</body>
</html>
