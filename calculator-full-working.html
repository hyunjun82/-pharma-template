<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기 - JJYU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-b from-gray-50 to-white">
    <div id="app"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        // Layout Component
        function Layout({ children }) {
            return (
                <div className="min-h-screen">
                    <header className="border-b border-gray-200 bg-white/80 backdrop-blur-lg sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <button onClick={() => setCurrentPage('home')} className="flex items-center space-x-3 cursor-pointer">
                                    <div className="text-2xl">🧮</div>
                                    <h1 className="text-xl font-semibold text-gray-900">계산기</h1>
                                </button>
                            </div>
                        </div>
                    </header>
                    {children}
                    <footer className="border-t border-gray-200 bg-gray-50 mt-12">
                        <div className="max-w-7xl mx-auto px-4 py-8 text-center">
                            <p className="text-sm text-gray-600">© 2025 JJYU Calculator</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Home Page
        function Home() {
            const [searchTerm, setSearchTerm] = useState('');

            const calculators = [
                { name: '취득세 계산기', icon: '🏠', page: 'acquisition-tax', category: '부동산' },
                { name: '실수령액 계산기', icon: '💰', page: 'take-home-pay', category: '급여' },
                { name: 'BMI 계산기', icon: '💊', page: 'bmi', category: '건강' },
                { name: '대출이자 계산기', icon: '🏦', page: 'loan-interest', category: '대출' },
                { name: '평수 계산기', icon: '📏', page: 'pyeong-converter', category: '부동산' },
            ];

            const filtered = calculators.filter(calc =>
                calc.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <Layout>
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-12">
                        <div className="text-center max-w-3xl mx-auto">
                            <h2 className="text-5xl font-bold text-gray-900 mb-4">
                                필요한 계산,
                                <br />
                                <span className="bg-gradient-to-r from-blue-600 to-cyan-500 bg-clip-text text-transparent">
                                    빠르고 정확하게
                                </span>
                            </h2>
                            <p className="text-xl text-gray-600 mb-8">
                                부동산부터 급여까지, 모든 계산기를 한곳에서
                            </p>

                            <div className="relative max-w-2xl mx-auto">
                                <input
                                    type="text"
                                    placeholder="계산기를 검색하세요 (예: 취득세, 실수령액, BMI)"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full px-6 py-4 text-lg border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"
                                />
                            </div>
                        </div>
                    </section>

                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
                        <h3 className="text-2xl font-bold text-gray-900 mb-6">인기 계산기</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
                            {filtered.map((calc, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setCurrentPage(calc.page)}
                                    className="group p-6 bg-white border border-gray-200 rounded-2xl hover:border-blue-300 hover:shadow-lg transition-all duration-200 text-left"
                                >
                                    <div className="text-3xl mb-3">{calc.icon}</div>
                                    <div className="text-sm font-medium text-gray-900 group-hover:text-blue-600">
                                        {calc.name}
                                    </div>
                                    <div className="text-xs text-gray-500 mt-1">{calc.category}</div>
                                </button>
                            ))}
                        </div>
                    </section>
                </Layout>
            );
        }

        // Acquisition Tax Calculator
        function AcquisitionTax() {
            const [price, setPrice] = useState('');
            const [houseCount, setHouseCount] = useState('1');
            const [result, setResult] = useState(null);

            const calculate = () => {
                const priceNum = parseFloat(price) * 10000;
                if (!priceNum || priceNum <= 0) {
                    alert('올바른 금액을 입력해주세요');
                    return;
                }

                let taxRate = 0;
                let eduTax = 0;

                if (houseCount === '1') {
                    if (priceNum <= 600000000) {
                        taxRate = 0.01;
                    } else if (priceNum <= 900000000) {
                        taxRate = 0.0133;
                    } else {
                        taxRate = 0.03;
                    }
                    eduTax = taxRate * 0.1;
                } else if (houseCount === '2') {
                    taxRate = 0.04;
                    eduTax = taxRate * 0.1;
                } else {
                    taxRate = 0.06;
                    eduTax = taxRate * 0.1;
                }

                const acquisitionTax = priceNum * taxRate;
                const localEduTax = priceNum * eduTax;
                const totalTax = acquisitionTax + localEduTax;

                setResult({
                    price: priceNum,
                    acquisitionTax,
                    localEduTax,
                    totalTax,
                    taxRate: (taxRate * 100).toFixed(2)
                });
            };

            const formatNumber = (num) => {
                return new Intl.NumberFormat('ko-KR').format(Math.round(num));
            };

            return (
                <Layout>
                    <div className="max-w-3xl mx-auto px-4 py-12">
                        <div className="text-center mb-8">
                            <div className="inline-block p-3 bg-blue-50 rounded-full mb-4">
                                <span className="text-4xl">🏠</span>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">취득세 계산기</h1>
                            <p className="text-gray-600">주택 구입 시 납부해야 할 취득세를 계산합니다</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-8 mb-8">
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        주택 매매 가격 (만원)
                                    </label>
                                    <input
                                        type="number"
                                        value={price}
                                        onChange={(e) => setPrice(e.target.value)}
                                        placeholder="예: 50000 (5억원)"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    />
                                    <p className="mt-1 text-sm text-gray-500">
                                        {price && `${formatNumber(parseFloat(price) * 10000)}원`}
                                    </p>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        보유 주택 수 (구입 후 기준)
                                    </label>
                                    <div className="grid grid-cols-3 gap-3">
                                        {['1', '2', '3+'].map((count) => (
                                            <button
                                                key={count}
                                                onClick={() => setHouseCount(count === '3+' ? '3' : count)}
                                                className={`py-3 rounded-lg font-medium transition ${
                                                    houseCount === (count === '3+' ? '3' : count)
                                                        ? 'bg-blue-600 text-white'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                {count}주택
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <button
                                    onClick={calculate}
                                    className="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white py-4 rounded-lg font-semibold text-lg hover:shadow-lg transition"
                                >
                                    계산하기
                                </button>
                            </div>
                        </div>

                        {result && (
                            <div className="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-2xl p-8">
                                <h2 className="text-xl font-bold text-gray-900 mb-6">계산 결과</h2>

                                <div className="space-y-4">
                                    <div className="flex justify-between items-center pb-3 border-b border-gray-200">
                                        <span className="text-gray-700">주택 가격</span>
                                        <span className="font-semibold text-gray-900">{formatNumber(result.price)}원</span>
                                    </div>

                                    <div className="flex justify-between items-center pb-3 border-b border-gray-200">
                                        <span className="text-gray-700">취득세율</span>
                                        <span className="font-semibold text-blue-600">{result.taxRate}%</span>
                                    </div>

                                    <div className="flex justify-between items-center pb-3 border-b border-gray-200">
                                        <span className="text-gray-700">취득세</span>
                                        <span className="font-semibold text-gray-900">{formatNumber(result.acquisitionTax)}원</span>
                                    </div>

                                    <div className="flex justify-between items-center pb-3 border-b border-gray-200">
                                        <span className="text-gray-700">지방교육세</span>
                                        <span className="font-semibold text-gray-900">{formatNumber(result.localEduTax)}원</span>
                                    </div>

                                    <div className="flex justify-between items-center pt-4">
                                        <span className="text-lg font-bold text-gray-900">총 납부 세액</span>
                                        <span className="text-2xl font-bold text-blue-600">{formatNumber(result.totalTax)}원</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </Layout>
            );
        }

        // Take Home Pay Calculator
        function TakeHomePay() {
            const [annualSalary, setAnnualSalary] = useState('');
            const [dependents, setDependents] = useState('1');
            const [result, setResult] = useState(null);

            const calculate = () => {
                const salary = parseFloat(annualSalary) * 10000;
                if (!salary || salary <= 0) {
                    alert('올바른 연봉을 입력해주세요');
                    return;
                }

                const monthlyGross = salary / 12;
                const nationalPension = Math.min(monthlyGross * 0.045, 248850);
                const healthInsurance = monthlyGross * 0.03545;
                const longTermCare = healthInsurance * 0.1295;
                const employmentInsurance = monthlyGross * 0.009;

                const totalInsurance = nationalPension + healthInsurance + longTermCare + employmentInsurance;

                const dependentDeduction = 150000 * parseInt(dependents);
                const taxableIncome = Math.max(0, monthlyGross - totalInsurance - dependentDeduction);

                let incomeTax = 0;
                if (taxableIncome <= 1200000) {
                    incomeTax = taxableIncome * 0.06;
                } else if (taxableIncome <= 4600000) {
                    incomeTax = 72000 + (taxableIncome - 1200000) * 0.15;
                } else if (taxableIncome <= 8800000) {
                    incomeTax = 582000 + (taxableIncome - 4600000) * 0.24;
                } else {
                    incomeTax = 1590000 + (taxableIncome - 8800000) * 0.35;
                }

                const localIncomeTax = incomeTax * 0.1;
                const totalTax = incomeTax + localIncomeTax;

                const monthlyNet = monthlyGross - totalInsurance - totalTax;

                setResult({
                    monthlyGross,
                    nationalPension,
                    healthInsurance,
                    longTermCare,
                    employmentInsurance,
                    totalInsurance,
                    incomeTax,
                    localIncomeTax,
                    totalTax,
                    monthlyNet,
                    annualNet: monthlyNet * 12
                });
            };

            const formatNumber = (num) => {
                return new Intl.NumberFormat('ko-KR').format(Math.round(num));
            };

            return (
                <Layout>
                    <div className="max-w-3xl mx-auto px-4 py-12">
                        <div className="text-center mb-8">
                            <div className="inline-block p-3 bg-green-50 rounded-full mb-4">
                                <span className="text-4xl">💰</span>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">실수령액 계산기</h1>
                            <p className="text-gray-600">연봉에서 4대보험과 세금을 제외한 실제 수령액을 계산합니다</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-8 mb-8">
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        연봉 (만원)
                                    </label>
                                    <input
                                        type="number"
                                        value={annualSalary}
                                        onChange={(e) => setAnnualSalary(e.target.value)}
                                        placeholder="예: 5000 (5천만원)"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                                    />
                                    <p className="mt-1 text-sm text-gray-500">
                                        {annualSalary && `${formatNumber(parseFloat(annualSalary) * 10000)}원`}
                                    </p>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        부양가족 수 (본인 포함)
                                    </label>
                                    <div className="grid grid-cols-4 gap-3">
                                        {['1', '2', '3', '4+'].map((count) => (
                                            <button
                                                key={count}
                                                onClick={() => setDependents(count === '4+' ? '4' : count)}
                                                className={`py-3 rounded-lg font-medium transition ${
                                                    dependents === (count === '4+' ? '4' : count)
                                                        ? 'bg-green-600 text-white'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                {count}명
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <button
                                    onClick={calculate}
                                    className="w-full bg-gradient-to-r from-green-600 to-emerald-500 text-white py-4 rounded-lg font-semibold text-lg hover:shadow-lg transition"
                                >
                                    계산하기
                                </button>
                            </div>
                        </div>

                        {result && (
                            <div className="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-8">
                                <h2 className="text-xl font-bold text-gray-900 mb-6">계산 결과</h2>

                                <div className="space-y-4">
                                    <div className="flex justify-between items-center pb-3 border-b border-gray-200">
                                        <span className="text-gray-700">월 급여 (세전)</span>
                                        <span className="font-semibold text-gray-900">{formatNumber(result.monthlyGross)}원</span>
                                    </div>

                                    <div className="bg-red-50 rounded-lg p-4 space-y-2">
                                        <p className="font-semibold text-gray-900 mb-2">4대보험</p>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-600">국민연금</span>
                                            <span className="text-red-600">{formatNumber(result.nationalPension)}원</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-600">건강보험</span>
                                            <span className="text-red-600">{formatNumber(result.healthInsurance)}원</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-600">장기요양</span>
                                            <span className="text-red-600">{formatNumber(result.longTermCare)}원</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-600">고용보험</span>
                                            <span className="text-red-600">{formatNumber(result.employmentInsurance)}원</span>
                                        </div>
                                    </div>

                                    <div className="bg-orange-50 rounded-lg p-4 space-y-2">
                                        <p className="font-semibold text-gray-900 mb-2">세금</p>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-600">소득세</span>
                                            <span className="text-orange-600">{formatNumber(result.incomeTax)}원</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-600">지방소득세</span>
                                            <span className="text-orange-600">{formatNumber(result.localIncomeTax)}원</span>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center pt-4">
                                        <span className="text-lg font-bold text-gray-900">월 실수령액</span>
                                        <span className="text-2xl font-bold text-green-600">{formatNumber(result.monthlyNet)}원</span>
                                    </div>

                                    <div className="flex justify-between items-center pt-2">
                                        <span className="text-gray-700">연 실수령액</span>
                                        <span className="font-semibold text-green-600">{formatNumber(result.annualNet)}원</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </Layout>
            );
        }

        // BMI Calculator
        function BMI() {
            const [height, setHeight] = useState('');
            const [weight, setWeight] = useState('');
            const [result, setResult] = useState(null);

            const calculate = () => {
                const h = parseFloat(height);
                const w = parseFloat(weight);

                if (!h || !w || h <= 0 || w <= 0) {
                    alert('올바른 값을 입력해주세요');
                    return;
                }

                const bmi = w / ((h / 100) ** 2);

                let category = '';
                let color = '';

                if (bmi < 18.5) {
                    category = '저체중';
                    color = 'text-blue-600';
                } else if (bmi < 23) {
                    category = '정상';
                    color = 'text-green-600';
                } else if (bmi < 25) {
                    category = '과체중';
                    color = 'text-yellow-600';
                } else if (bmi < 30) {
                    category = '비만';
                    color = 'text-orange-600';
                } else {
                    category = '고도비만';
                    color = 'text-red-600';
                }

                const standardWeight = 22 * ((h / 100) ** 2);
                const diff = w - standardWeight;

                setResult({ bmi: bmi.toFixed(1), category, color, standardWeight, diff });
            };

            const formatNumber = (num) => {
                return new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 1 }).format(num);
            };

            return (
                <Layout>
                    <div className="max-w-3xl mx-auto px-4 py-12">
                        <div className="text-center mb-8">
                            <div className="inline-block p-3 bg-pink-50 rounded-full mb-4">
                                <span className="text-4xl">💊</span>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">BMI 계산기</h1>
                            <p className="text-gray-600">체질량지수를 계산하여 비만도를 확인합니다</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-8 mb-8">
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        키 (cm)
                                    </label>
                                    <input
                                        type="number"
                                        value={height}
                                        onChange={(e) => setHeight(e.target.value)}
                                        placeholder="예: 170"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        몸무게 (kg)
                                    </label>
                                    <input
                                        type="number"
                                        value={weight}
                                        onChange={(e) => setWeight(e.target.value)}
                                        placeholder="예: 65"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                                    />
                                </div>

                                <button
                                    onClick={calculate}
                                    className="w-full bg-gradient-to-r from-pink-600 to-rose-500 text-white py-4 rounded-lg font-semibold text-lg hover:shadow-lg transition"
                                >
                                    계산하기
                                </button>
                            </div>
                        </div>

                        {result && (
                            <div className="bg-gradient-to-br from-pink-50 to-rose-50 rounded-2xl p-8">
                                <h2 className="text-xl font-bold text-gray-900 mb-6">계산 결과</h2>

                                <div className="text-center mb-6">
                                    <p className="text-gray-600 mb-2">BMI 지수</p>
                                    <p className={`text-5xl font-bold ${result.color}`}>{result.bmi}</p>
                                    <p className={`text-2xl font-semibold mt-2 ${result.color}`}>{result.category}</p>
                                </div>

                                <div className="space-y-3">
                                    <div className="flex justify-between items-center pb-2 border-b border-gray-200">
                                        <span className="text-gray-700">표준 체중</span>
                                        <span className="font-semibold">{formatNumber(result.standardWeight)}kg</span>
                                    </div>
                                    <div className="flex justify-between items-center pb-2 border-b border-gray-200">
                                        <span className="text-gray-700">표준 체중과의 차이</span>
                                        <span className={`font-semibold ${result.diff > 0 ? 'text-red-600' : 'text-blue-600'}`}>
                                            {result.diff > 0 ? '+' : ''}{formatNumber(result.diff)}kg
                                        </span>
                                    </div>
                                </div>

                                <div className="mt-6 p-4 bg-white rounded-lg">
                                    <p className="text-sm font-semibold text-gray-900 mb-2">BMI 기준 (WHO 아시아-태평양)</p>
                                    <div className="space-y-1 text-sm text-gray-600">
                                        <div className="flex justify-between">
                                            <span>저체중</span>
                                            <span>18.5 미만</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>정상</span>
                                            <span>18.5 ~ 22.9</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>과체중</span>
                                            <span>23 ~ 24.9</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>비만</span>
                                            <span>25 ~ 29.9</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>고도비만</span>
                                            <span>30 이상</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </Layout>
            );
        }

        // Loan Interest Calculator
        function LoanInterest() {
            const [loanAmount, setLoanAmount] = useState('');
            const [interestRate, setInterestRate] = useState('');
            const [loanPeriod, setLoanPeriod] = useState('');
            const [repaymentType, setRepaymentType] = useState('equal');
            const [result, setResult] = useState(null);

            const calculate = () => {
                const principal = parseFloat(loanAmount) * 10000;
                const rate = parseFloat(interestRate) / 100 / 12;
                const months = parseInt(loanPeriod);

                if (!principal || !rate || !months || principal <= 0 || rate <= 0 || months <= 0) {
                    alert('올바른 값을 입력해주세요');
                    return;
                }

                let monthlyPayments = [];
                let totalInterest = 0;

                if (repaymentType === 'equal') {
                    const monthlyPayment = principal * (rate * Math.pow(1 + rate, months)) / (Math.pow(1 + rate, months) - 1);
                    let remainingPrincipal = principal;

                    for (let i = 1; i <= Math.min(months, 12); i++) {
                        const interestPayment = remainingPrincipal * rate;
                        const principalPayment = monthlyPayment - interestPayment;
                        remainingPrincipal -= principalPayment;

                        monthlyPayments.push({
                            month: i,
                            payment: monthlyPayment,
                            principal: principalPayment,
                            interest: interestPayment,
                            remaining: Math.max(0, remainingPrincipal)
                        });
                    }

                    // Calculate total interest for entire period
                    remainingPrincipal = principal;
                    for (let i = 1; i <= months; i++) {
                        const interestPayment = remainingPrincipal * rate;
                        const principalPayment = monthlyPayment - interestPayment;
                        remainingPrincipal -= principalPayment;
                        totalInterest += interestPayment;
                    }

                    setResult({
                        type: '원리금균등상환',
                        monthlyPayments,
                        firstMonthPayment: monthlyPayment,
                        lastMonthPayment: monthlyPayment,
                        totalInterest,
                        totalPayment: principal + totalInterest,
                        principal
                    });
                } else {
                    const principalPayment = principal / months;
                    let remainingPrincipal = principal;

                    for (let i = 1; i <= Math.min(months, 12); i++) {
                        const interestPayment = remainingPrincipal * rate;
                        const monthlyPayment = principalPayment + interestPayment;
                        remainingPrincipal -= principalPayment;

                        monthlyPayments.push({
                            month: i,
                            payment: monthlyPayment,
                            principal: principalPayment,
                            interest: interestPayment,
                            remaining: Math.max(0, remainingPrincipal)
                        });
                    }

                    // Calculate total interest for entire period
                    remainingPrincipal = principal;
                    for (let i = 1; i <= months; i++) {
                        const interestPayment = remainingPrincipal * rate;
                        remainingPrincipal -= principalPayment;
                        totalInterest += interestPayment;
                    }

                    setResult({
                        type: '원금균등상환',
                        monthlyPayments,
                        firstMonthPayment: monthlyPayments[0].payment,
                        lastMonthPayment: principalPayment + (principal - principalPayment * (months - 1)) * rate,
                        totalInterest,
                        totalPayment: principal + totalInterest,
                        principal
                    });
                }
            };

            const formatNumber = (num) => {
                return new Intl.NumberFormat('ko-KR').format(Math.round(num));
            };

            return (
                <Layout>
                    <div className="max-w-4xl mx-auto px-4 py-12">
                        <div className="text-center mb-8">
                            <div className="inline-block p-3 bg-purple-50 rounded-full mb-4">
                                <span className="text-4xl">🏦</span>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">대출 이자 계산기</h1>
                            <p className="text-gray-600">대출 상환 방법에 따른 월 상환액과 총 이자를 계산합니다</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-8 mb-8">
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        대출 금액 (만원)
                                    </label>
                                    <input
                                        type="number"
                                        value={loanAmount}
                                        onChange={(e) => setLoanAmount(e.target.value)}
                                        placeholder="예: 30000 (3억원)"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                    <p className="mt-1 text-sm text-gray-500">
                                        {loanAmount && `${formatNumber(parseFloat(loanAmount) * 10000)}원`}
                                    </p>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        연 이자율 (%)
                                    </label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={interestRate}
                                        onChange={(e) => setInterestRate(e.target.value)}
                                        placeholder="예: 3.5"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        대출 기간 (개월)
                                    </label>
                                    <input
                                        type="number"
                                        value={loanPeriod}
                                        onChange={(e) => setLoanPeriod(e.target.value)}
                                        placeholder="예: 360 (30년)"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                    <p className="mt-1 text-sm text-gray-500">
                                        {loanPeriod && `${Math.floor(parseInt(loanPeriod) / 12)}년 ${parseInt(loanPeriod) % 12}개월`}
                                    </p>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        상환 방식
                                    </label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            onClick={() => setRepaymentType('equal')}
                                            className={`py-3 px-4 rounded-lg font-medium transition ${
                                                repaymentType === 'equal'
                                                    ? 'bg-purple-600 text-white'
                                                    : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                            }`}
                                        >
                                            <div className="text-sm">원리금균등상환</div>
                                            <div className="text-xs opacity-80">매월 같은 금액</div>
                                        </button>
                                        <button
                                            onClick={() => setRepaymentType('principal')}
                                            className={`py-3 px-4 rounded-lg font-medium transition ${
                                                repaymentType === 'principal'
                                                    ? 'bg-purple-600 text-white'
                                                    : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                            }`}
                                        >
                                            <div className="text-sm">원금균등상환</div>
                                            <div className="text-xs opacity-80">원금은 매월 같음</div>
                                        </button>
                                    </div>
                                </div>

                                <button
                                    onClick={calculate}
                                    className="w-full bg-gradient-to-r from-purple-600 to-indigo-500 text-white py-4 rounded-lg font-semibold text-lg hover:shadow-lg transition"
                                >
                                    계산하기
                                </button>
                            </div>
                        </div>

                        {result && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-purple-50 to-indigo-50 rounded-2xl p-8">
                                    <h2 className="text-xl font-bold text-gray-900 mb-6">{result.type}</h2>

                                    <div className="grid md:grid-cols-2 gap-4 mb-6">
                                        <div className="bg-white rounded-lg p-4">
                                            <p className="text-sm text-gray-600 mb-1">첫 달 상환액</p>
                                            <p className="text-2xl font-bold text-purple-600">{formatNumber(result.firstMonthPayment)}원</p>
                                        </div>
                                        <div className="bg-white rounded-lg p-4">
                                            <p className="text-sm text-gray-600 mb-1">마지막 달 상환액</p>
                                            <p className="text-2xl font-bold text-purple-600">{formatNumber(result.lastMonthPayment)}원</p>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center pb-2 border-b border-gray-200">
                                            <span className="text-gray-700">대출 원금</span>
                                            <span className="font-semibold">{formatNumber(result.principal)}원</span>
                                        </div>
                                        <div className="flex justify-between items-center pb-2 border-b border-gray-200">
                                            <span className="text-gray-700">총 이자</span>
                                            <span className="font-semibold text-red-600">{formatNumber(result.totalInterest)}원</span>
                                        </div>
                                        <div className="flex justify-between items-center pt-2">
                                            <span className="text-lg font-bold text-gray-900">총 상환액</span>
                                            <span className="text-2xl font-bold text-purple-600">{formatNumber(result.totalPayment)}원</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl p-6 shadow">
                                    <h3 className="font-bold text-gray-900 mb-4">월별 상환 계획 (처음 12개월)</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-50">
                                                <tr>
                                                    <th className="px-4 py-2 text-left">회차</th>
                                                    <th className="px-4 py-2 text-right">월 상환액</th>
                                                    <th className="px-4 py-2 text-right">원금</th>
                                                    <th className="px-4 py-2 text-right">이자</th>
                                                    <th className="px-4 py-2 text-right">잔액</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {result.monthlyPayments.map((payment) => (
                                                    <tr key={payment.month}>
                                                        <td className="px-4 py-2">{payment.month}회</td>
                                                        <td className="px-4 py-2 text-right font-medium">{formatNumber(payment.payment)}</td>
                                                        <td className="px-4 py-2 text-right text-blue-600">{formatNumber(payment.principal)}</td>
                                                        <td className="px-4 py-2 text-right text-red-600">{formatNumber(payment.interest)}</td>
                                                        <td className="px-4 py-2 text-right text-gray-600">{formatNumber(payment.remaining)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </Layout>
            );
        }

        // Pyeong Converter
        function PyeongConverter() {
            const [pyeong, setPyeong] = useState('');
            const [squareMeter, setSquareMeter] = useState('');

            const pyeongToSquareMeter = (value) => {
                const p = parseFloat(value);
                if (!p || p <= 0) {
                    setSquareMeter('');
                    return;
                }
                const sm = (p * 3.3058).toFixed(2);
                setSquareMeter(sm);
            };

            const squareMeterToPyeong = (value) => {
                const sm = parseFloat(value);
                if (!sm || sm <= 0) {
                    setPyeong('');
                    return;
                }
                const p = (sm / 3.3058).toFixed(2);
                setPyeong(p);
            };

            const commonSizes = [
                { pyeong: 10, name: '소형 원룸' },
                { pyeong: 20, name: '중형 투룸' },
                { pyeong: 25, name: '중대형 투룸' },
                { pyeong: 30, name: '소형 아파트' },
                { pyeong: 33, name: '국민 평수' },
                { pyeong: 40, name: '중형 아파트' },
                { pyeong: 50, name: '대형 아파트' },
                { pyeong: 60, name: '초대형 아파트' },
            ];

            return (
                <Layout>
                    <div className="max-w-3xl mx-auto px-4 py-12">
                        <div className="text-center mb-8">
                            <div className="inline-block p-3 bg-cyan-50 rounded-full mb-4">
                                <span className="text-4xl">📏</span>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">평수 계산기</h1>
                            <p className="text-gray-600">평(坪)과 제곱미터(m²)를 변환합니다</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-8 mb-8">
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        평 (坪)
                                    </label>
                                    <input
                                        type="number"
                                        value={pyeong}
                                        onChange={(e) => {
                                            setPyeong(e.target.value);
                                            pyeongToSquareMeter(e.target.value);
                                        }}
                                        placeholder="평 입력"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                    />
                                </div>

                                <div className="flex justify-center">
                                    <div className="p-3 bg-gray-100 rounded-full">
                                        <svg className="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                                        </svg>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        제곱미터 (m²)
                                    </label>
                                    <input
                                        type="number"
                                        value={squareMeter}
                                        onChange={(e) => {
                                            setSquareMeter(e.target.value);
                                            squareMeterToPyeong(e.target.value);
                                        }}
                                        placeholder="m² 입력"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                    />
                                </div>

                                <div className="bg-cyan-50 rounded-lg p-4">
                                    <p className="text-sm text-gray-700 text-center">
                                        <span className="font-semibold">1평 = 3.3058 m²</span>
                                        <br />
                                        <span className="text-gray-600">1 m² = 0.3025평</span>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-8">
                            <h2 className="text-xl font-bold text-gray-900 mb-6">주요 평수 참고표</h2>

                            <div className="grid gap-3">
                                {commonSizes.map((size) => (
                                    <button
                                        key={size.pyeong}
                                        onClick={() => {
                                            setPyeong(size.pyeong.toString());
                                            pyeongToSquareMeter(size.pyeong.toString());
                                            window.scrollTo({ top: 0, behavior: 'smooth' });
                                        }}
                                        className="group flex items-center justify-between p-4 bg-gray-50 hover:bg-cyan-50 rounded-lg transition"
                                    >
                                        <div className="text-left">
                                            <p className="font-semibold text-gray-900">{size.name}</p>
                                            <p className="text-sm text-gray-600">
                                                {size.pyeong}평 = {(size.pyeong * 3.3058).toFixed(2)}m²
                                            </p>
                                        </div>
                                        <svg className="w-5 h-5 text-gray-400 group-hover:text-cyan-600 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                        </svg>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </Layout>
            );
        }

        // Main App Component
        let setCurrentPage;

        function App() {
            const [currentPage, _setCurrentPage] = useState('home');
            setCurrentPage = _setCurrentPage;

            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <Home />;
                    case 'acquisition-tax': return <AcquisitionTax />;
                    case 'take-home-pay': return <TakeHomePay />;
                    case 'bmi': return <BMI />;
                    case 'loan-interest': return <LoanInterest />;
                    case 'pyeong-converter': return <PyeongConverter />;
                    default: return <Home />;
                }
            };

            return renderPage();
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
